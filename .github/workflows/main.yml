name: Extract & Replace Project Code

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL or path of the uploaded zip file'
        required: true
        default: 'project.zip'

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean existing code (keep .git and .github)
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '${{ github.event.inputs.zip_url }}' -exec rm -rf {} +

      - name: Extract new ZIP code
        run: |
          unzip -o ${{ github.event.inputs.zip_url }} -d .

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto update project from ZIP export" || echo "No changes to commit"
          git push origin main
