name: Clean, Unzip and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete Old Repository Files (except git and github)
        run: |
          echo "Cleaning up existing project files..."
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name '*.zip' -exec rm -rf {} +

      - name: Extract Project ZIP
        run: |
          echo "Looking for uploaded zip file..."
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d .
            rm -f "$ZIP_FILE"
          else
            echo "No zip file found in root directory, skipping unzip step."
          fi

      - name: Run Bash Scripts
        run: |
          echo "Executing setup / build scripts if present..."
          if [ -f "setup.sh" ]; then
            chmod +x setup.sh
            ./setup.sh
          fi
          if [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          fi

      - name: Commit and Push Updated Code back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Auto-clean, unzip project and run build scripts [skip ci]"
            git push
          fi
